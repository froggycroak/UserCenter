<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>用户中心弹窗调用演示</title>
  <style>
    :root { font-family: Inter, "Noto Sans SC", system-ui, sans-serif; color: #1d1d1f; }
    body { margin: 24px; }
    h1 { font-size: 1.25rem; }
    p, li { color: #6e6e73; font-size: 0.9rem; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
    button {
      border: 0; border-radius: 980px; padding: 0.4rem 1.1rem; min-height: 2rem;
      background: #1d1d1f; color: #fff; cursor: pointer; font: inherit;
    }
    button.secondary { background: rgba(0,0,0,.08); color: #1d1d1f; }
    .log {
      white-space: pre-wrap; background: #f5f5f7; border-radius: 12px;
      padding: 12px; min-height: 8rem; font-size: 12px;
    }
    .mask {
      display: none; position: fixed; inset: 0; background: rgba(29,29,31,.52);
      align-items: center; justify-content: center; z-index: 20;
    }
    .mask.on { display: flex; }
    iframe {
      width: min(460px, calc(100vw - 32px)); height: min(720px, calc(100dvh - 32px));
      border: 0; border-radius: 20px; background: transparent;
    }
  </style>
</head>
<body>
  <h1>用户中心弹窗调用演示</h1>
  <p>模拟其它应用用 iframe 打开登录 / 资料弹窗。请使用你们自己的测试账号（不要把真实密码写进仓库）。</p>
  <div class="row">
    <button type="button" id="btn-login">打开登录弹窗</button>
    <button type="button" class="secondary" id="btn-edit">打开资料/改密弹窗</button>
    <button type="button" class="secondary" id="btn-clear">清空日志与令牌</button>
  </div>
  <p>收到的 postMessage：</p>
  <pre class="log" id="log">（等待）</pre>
  <div class="mask" id="mask"><iframe id="frame" title="user-center"></iframe></div>
  <script>
    const origin = location.origin
    const logEl = document.getElementById('log')
    const mask = document.getElementById('mask')
    const frame = document.getElementById('frame')
    let accessToken = sessionStorage.getItem('demo.access') || ''
    let refreshToken = sessionStorage.getItem('demo.refresh') || ''
    let pending = ''

    function log(line) {
      const prev = logEl.textContent === '（等待）' ? '' : logEl.textContent + '\n'
      logEl.textContent = prev + line
    }

    function openPopup(path) {
      pending = path
      const q = new URLSearchParams({ embed: '1', parentOrigin: origin })
      frame.src = origin + path + '?' + q.toString()
      mask.classList.add('on')
    }

    function closePopup() {
      mask.classList.remove('on')
      frame.src = 'about:blank'
      pending = ''
    }

    document.getElementById('btn-login').onclick = () => openPopup('/login')
    document.getElementById('btn-edit').onclick = () => {
      if (!accessToken) {
        log('还没有 token，请先登录。')
        return
      }
      openPopup('/edit')
    }
    document.getElementById('btn-clear').onclick = () => {
      accessToken = ''
      refreshToken = ''
      sessionStorage.removeItem('demo.access')
      sessionStorage.removeItem('demo.refresh')
      logEl.textContent = '（等待）'
    }
    mask.onclick = (e) => { if (e.target === mask) closePopup() }

    window.addEventListener('message', (event) => {
      if (event.origin !== origin) return
      const data = event.data
      if (!data || data.source !== 'udapp-user-center') return
      log(JSON.stringify(data, null, 2))
      if (data.type === 'ready' && data.page === 'edit' && accessToken && frame.contentWindow) {
        frame.contentWindow.postMessage({
          source: 'udapp-user-center-host',
          type: 'setToken',
          accessToken,
          refreshToken
        }, origin)
      }
      if (data.type === 'login') {
        accessToken = data.accessToken || ''
        refreshToken = data.refreshToken || ''
        sessionStorage.setItem('demo.access', accessToken)
        sessionStorage.setItem('demo.refresh', refreshToken)
        closePopup()
      }
      if (data.type === 'close') closePopup()
    })
  </script>
</body>
</html>
