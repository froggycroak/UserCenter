# Example nginx site for Research Portal (web_sstd) on :1088
# Copy/adapt on the deploy host; root must point at the built dist folder.
#
# Build:  build_sstd.bat
# Output: <repo>/web_sstd/dist

server {
    listen 1088;
    server_name _;

    # Absolute path to web_sstd/dist on the server
    root /path/to/user-center/web_sstd/dist;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: same-origin /api proxy to User Center Kestrel (:1010).
    # Prefer this over browser CORS when portal needs live APIs.
    # location /api/ {
    #     proxy_pass http://127.0.0.1:1010;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # Static assets
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}
